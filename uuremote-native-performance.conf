# UU 远程 Linux 性能调优（由 uu-remote-linux-bundle 安装）
#
# 延迟来源与对策：
#   * NVENC 的 VBV 缓冲默认是「1 秒码率上限」（上限 500–8000 kbit），
#     12 Mbit/s 上限时约 0.9 秒，纯属白等 —— 改成 50 毫秒级缓冲。
#   * 帧率封顶 30：60 帧会让采集、缩放、编码、解码、管道传输全部翻倍。
#   * 码率封顶 12 Mbit/s：自动画质原本不限码率，带宽一抖就出延迟和丢帧。
#
# 想改回上游默认：把下面三行注释掉，或在用户级放一份覆盖
#   ~/.config/systemd/user/uuremote-native.service.d/performance.conf
[Service]
Environment=UU_NVENC_BUFFER_MS=50
Environment=UU_MAX_FPS=30
Environment=UU_MAX_KBIT=12000
